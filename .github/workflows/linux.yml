name: Desktop app (Linux, macOS)

on:
  push:
    branches: [ development, 'feature/**' ]
    tags: [ 'linux-v*' ]
  pull_request:
    branches: [ development ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/linux-v* ]]; then v="${GITHUB_REF_NAME#linux-v}"; else v="0.1.0-ci.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Unit tests (container)
        run: make test

      - name: Windows core still builds (net481, container)
        run: make test-win

      - name: Build dist + AppImage (container)
        run: make appimage VERSION=${{ steps.version.outputs.version }}

      - name: Smoke test AppImage under Xvfb
        run: make smoke VERSION=${{ steps.version.outputs.version }}

      - name: Build universal macOS app (container, cross-published)
        run: make macos VERSION=${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v5
        with:
          name: xcp-ng-center-${{ steps.version.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*_macos_universal.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/linux-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum *.tar.gz *.AppImage *_macos_universal.zip > SHA256SUMS
          # notes: this version's section of XenAdmin.Desktop/CHANGELOG.md, else GitHub's generated notes
          awk -v h="## [${{ steps.version.outputs.version }}]" 'index($0,h)==1{f=1;next} f&&/^## \[/{exit} f' ../XenAdmin.Desktop/CHANGELOG.md > ../notes.md
          if [ -s ../notes.md ]; then notes=(--notes-file ../notes.md); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" --title "XCP-ng Center for Linux and macOS ${{ steps.version.outputs.version }}" \
            "${notes[@]}" --prerelease *.tar.gz *.AppImage *_macos_universal.zip SHA256SUMS
