name: Linux desktop app

on:
  push:
    branches: [ development, 'feature/**' ]
    tags: [ 'linux-v*' ]
  pull_request:
    branches: [ development ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/linux-v* ]]; then v="${GITHUB_REF_NAME#linux-v}"; else v="0.1.0-ci.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Unit tests (container)
        run: make test

      - name: Windows core still builds (net481, container)
        run: make test-win

      - name: Build dist + AppImage (container)
        run: make appimage VERSION=${{ steps.version.outputs.version }}

      - name: Smoke test AppImage under Xvfb
        run: make smoke VERSION=${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v5
        with:
          name: xcp-ng-center-${{ steps.version.outputs.version }}-linux
          path: |
            dist/*.tar.gz
            dist/*.AppImage

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/linux-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum *.tar.gz *.AppImage > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --title "XCP-ng Center for Linux ${{ steps.version.outputs.version }}" \
            --generate-notes --prerelease *.tar.gz *.AppImage SHA256SUMS
